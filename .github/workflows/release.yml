name: Release

# Runs only after CI passes on main, so a release can never be cut from a
# red commit. The release commit carries [skip ci], which skips the CI run
# and therefore cannot trigger another release.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    # workflow_run fires for every CI run, including pull requests and
    # failures, so narrow it to a green run of a push to main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        run: pip install python-semantic-release>=10.0

      - name: Run semantic-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: semantic-release version

      - name: Trigger publish on new tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG=$(git describe --exact-match --tags HEAD 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            echo "New release tag: $TAG — triggering publish workflow"
            gh workflow run publish.yml \
              --repo ${{ github.repository }} \
              --ref "$TAG"
          else
            echo "No new tag on HEAD — skipping publish"
          fi

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=62.3"]

[project]
name = "sendspin-image-server"
version = "1.22.1"
description = "Sendspin server that serves a silent audio stream and distributes image updates to artwork clients"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
  "websockets>=14.0",
  "zeroconf>=0.131.0",
  "aiohttp>=3.9.0",
  "Pillow>=10.0.0",
  "numpy>=1.26.0",
  "aiosqlite>=0.20.0",
]

[project.scripts]
sendspin-image-server = "sendspin_image_server.cli:main"

[project.optional-dependencies]
dev = [
  "mypy==2.4.0",
  "ruff==0.16.10",
  "pytest>=9.0",
  "pytest-asyncio>=1.0",
  "python-semantic-release>=10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sendspin_image_server*"]

[tool.setuptools.package-data]
sendspin_image_server = ["ui_dist/**/*", "tables/*.act"]

[tool.ruff]
fix = true
show-fixes = true
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN002",
  "ANN003",
  "ANN401",
  "D203",
  "D213",
  "D417",
  "EM101",
  "EM102",
  "FIX002",
  "PLR2004",
  "PGH004",
  "PD011",
  "S101",
  "TC001",
  "TC003",
  "TD002",
  "TD003",
  "TD004",
  "TRY003",
  "TRY400",
  "COM812",
  "S104",
  # House style, deliberately not adopted:
  "CPY001",  # no copyright headers anywhere in the project
  "D102",    # methods are not individually documented (D100/D101/D103 still apply)
  "D105",    # ditto for dunders
  "D107",    # ditto for __init__
  "PLC0415", # heavy imports (aiohttp, PIL) are deferred on purpose
  "N806",    # matrix/geometry locals use maths conventions (W, H, M, COLS)
  "RUF002",  # docstrings use real typographic characters (—, ×)
]

[tool.ruff.lint.per-file-ignores]
# Tests are not library code: they need no docstrings or annotations, and
# reaching into internals is how several of them assert behaviour.
"tests/*" = [
  "ANN001",
  "ANN201",
  "ANN202",
  "D100",
  "D101",
  "D102",
  "D103",
  "INP001",
  "PLR0911",
  "RUF001",
  "SLF001",
]

# Thresholds sit just above the worst offender that is *not* explicitly
# suppressed, so they act as a ratchet: nothing may get more complex than
# what is already here. See todos.md for the functions worth splitting.
[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.pylint]
max-returns = 9
max-branches = 20
max-statements = 60
max-args = 9
max-positional-args = 9

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
follow_imports = "normal"
ignore_missing_imports = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
packages = ["sendspin_image_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "chore(release): v{version} [skip ci]"
tag_format = "v{version}"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
  "^chore",
  "^ci",
  "^Merge",
]

[tool.semantic_release.remote]
type = "github"
